<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoTS — Great Forecasting for Everyone</title>
  <meta name="description" content="Upload a spreadsheet and forecast it in your browser. No code, no server." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#00696e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1a22" media="(prefers-color-scheme: dark)" />

  <!-- Apply the saved theme before first paint to avoid a flash of the wrong
       theme. Runs before the WASM bundle mounts. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("autots-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Self-hosted fonts (copied to dist/fonts by Trunk) -->
  <link data-trunk rel="copy-dir" href="public/fonts" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/inter-variable.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/cinzel-variable.woff2" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" href="favicon-180.png" />
  <link data-trunk rel="copy-file" href="public/favicon.svg" />
  <link data-trunk rel="copy-file" href="public/favicon-32.png" />
  <link data-trunk rel="copy-file" href="public/favicon-16.png" />
  <link data-trunk rel="copy-file" href="public/favicon-180.png" />

  <!-- Runtime configuration consumed by autots_client.js / the worker -->
  <script>
    self.AUTOTS_WORKER_URL = 'pyodide_worker.js';
    // Wheel URL is discovered at runtime from /autots_wheel.json (built by
    // scripts/build_wheel.sh) because micropip needs the exact PEP-427 name.
    self.AUTOTS_PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js';
  </script>

  <!-- The language-neutral client facade (defines window.autotsClient) -->
  <link data-trunk rel="copy-file" href="js/autots_client.js" />
  <link data-trunk rel="copy-file" href="worker/pyodide_worker.js" />
  <link data-trunk rel="copy-file" href="public/llms.txt" />
  <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
  <link data-trunk rel="css" href="styles/md3.css" />
  <script src="autots_client.js"></script>
</head>
<body></body>
</html>
