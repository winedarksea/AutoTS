[package]
name = "autots-pwa"
version = "0.1.0"
edition = "2021"
description = "Progressive Web App for AutoTS forecasting (Leptos + Pyodide)"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
base64 = "0.22"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Storage",
  "MediaQueryList",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlAnchorElement",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileReader",
  "ProgressEvent",
]

[profile.release]
opt-level = "z"
lto = true
